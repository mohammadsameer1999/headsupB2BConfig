events {
    worker_connections 1024;
}

http {
    error_log /var/log/nginx/error.log debug;

    server {
        listen 80;
        server_name api-crm.headsupb2b.com;
        return 301 https://$host$request_uri;  
    }

    server {
        listen 443 ssl;
        server_name api-crm.headsupb2b.com;

        ssl_certificate /etc/letsencrypt/live/api-crm.headsupb2b.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api-crm.headsupb2b.com/privkey.pem;

        location / {
            proxy_pass http://apigatewayheadsup:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;


            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
